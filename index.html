<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>SQLite Viewer with sql.js</title>
  <style>
    /* Reset and base */
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
      max-width: 350px;
      height: 600px;
      overflow: hidden;
      user-select: none;
    }
    header {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
      text-align: center;
      text-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }
    #db-file-label {
      display: inline-block;
      padding: 10px 15px;
      background-color: #5a4ba3;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 10px;
      user-select: none;
      transition: background-color 0.3s ease;
    }
    #db-file-label:hover {
      background-color: #7d69e3;
    }
    #db-file {
      display: none;
    }
    #status {
      font-size: 0.9rem;
      min-height: 1.5rem;
      margin-bottom: 8px;
      color: #ffecb3;
      text-align: center;
      user-select: text;
      word-break: break-word;
    }
    textarea, input[type=text] {
      font-family: monospace;
      font-size: 1rem;
      border-radius: 8px;
      border: none;
      padding: 8px;
      margin-bottom: 10px;
      width: 100%;
      resize: vertical;
    }
    textarea {
      height: 100px;
      min-height: 80px;
      max-height: 150px;
    }
    button {
      background-color: #7d69e3;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
      user-select: none;
      width: 100%;
    }
    button:disabled {
      background-color: #3a316d;
      cursor: not-allowed;
    }
    button:hover:not(:disabled) {
      background-color: #a194f7;
    }
    #result {
      background-color: rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 10px;
      overflow-x: auto;
      max-height: 180px;
      font-size: 0.85rem;
      white-space: pre-wrap;
      user-select: text;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 6px;
    }
    th, td {
      border: 1px solid rgba(255,255,255,0.3);
      padding: 6px 8px;
      text-align: left;
      max-width: 130px;
      word-wrap: break-word;
    }
    th {
      background-color: rgba(255,255,255,0.15);
    }
    footer {
      margin-top: auto;
      font-size: 0.75rem;
      color: #ccc;
      text-align: center;
      user-select: none;
      padding: 8px 0 2px 0;
    }
  </style>
</head>
<body>
  <header>SQLite Viewer with sql.js</header>
  
  <label id="db-file-label" for="db-file" aria-describedby="status">Select SQLite DB File</label>
  <input type="file" id="db-file" accept=".sqlite,.db,.sqlite3,.bin" />
  <div id="status" role="status" aria-live="polite"></div>
  
  <textarea id="sql-input" placeholder="Enter SQL query here (e.g. SELECT * FROM table)" aria-label="SQL Query Input" disabled></textarea>
  <button id="run-query" disabled>Run Query</button>
  
  <div id="result" aria-live="polite" aria-atomic="true"></div>

  <footer>
    Powered by <a href="https://sql.js.org/" target="_blank" rel="noopener noreferrer" style="color:#b3b0f7;">sql.js</a>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
  <script>
    let db = null;
    let SQL = null;
    const fileInput = document.getElementById('db-file');
    const status = document.getElementById('status');
    const sqlInput = document.getElementById('sql-input');
    const runBtn = document.getElementById('run-query');
    const resultDiv = document.getElementById('result');

    // Initialize sql.js
    status.textContent = 'Loading sql.js...';
    initSqlJs({ locateFile: file => 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/' + file })
      .then(SQLLib => {
        SQL = SQLLib;
        status.textContent = 'sql.js loaded. Please select a SQLite database file.';
        fileInput.disabled = false;
      })
      .catch(e => {
        status.textContent = 'Failed to load sql.js: ' + e.message;
        fileInput.disabled = true;
      });

    // Handle file selection
    fileInput.addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      status.textContent = 'Reading database file...';
      sqlInput.value = '';
      resultDiv.textContent = '';
      sqlInput.disabled = true;
      runBtn.disabled = true;
      reader.onload = function() {
        try {
          const Uints = new Uint8Array(reader.result);
          db = new SQL.Database(Uints);
          status.textContent = `Database loaded: ${file.name}`;
          sqlInput.disabled = false;
          runBtn.disabled = false;
          sqlInput.focus();
        } catch (err) {
          status.textContent = 'Error loading database: ' + err.message;
          db = null;
          sqlInput.disabled = true;
          runBtn.disabled = true;
        }
      };
      reader.onerror = function() {
        status.textContent = 'Error reading file.';
        db = null;
        sqlInput.disabled = true;
        runBtn.disabled = true;
      };
      reader.readAsArrayBuffer(file);
    });

    // Run query handler
    runBtn.addEventListener('click', () => {
      if (!db) return;
      const query = sqlInput.value.trim();
      resultDiv.textContent = '';
      if (!query) {
        status.textContent = 'Please enter a SQL query.';
        return;
      }
      try {
        const results = db.exec(query);
        if (results.length === 0) {
          resultDiv.textContent = 'Query executed successfully. No rows returned.';
        } else {
          // Render results as a table
          const table = document.createElement('table');
          // Table header
          const thead = document.createElement('thead');
          const headerRow = document.createElement('tr');
          results[0].columns.forEach(col => {
            const th = document.createElement('th');
            th.textContent = col;
            headerRow.appendChild(th);
          });
          thead.appendChild(headerRow);
          table.appendChild(thead);

          // Table body
          const tbody = document.createElement('tbody');
          results[0].values.forEach(row => {
            const tr = document.createElement('tr');
            row.forEach(cell => {
              const td = document.createElement('td');
              td.textContent = cell === null ? 'NULL' : cell;
              tr.appendChild(td);
            });
            tbody.appendChild(tr);
          });
          table.appendChild(tbody);

          resultDiv.appendChild(table);
        }
        status.textContent = 'Query run successfully.';
      } catch (err) {
        status.textContent = 'SQL Error: ' + err.message;
        resultDiv.textContent = '';
      }
    });

    // Allow pressing Enter with Ctrl+Enter or Shift+Enter to run query on textarea
    sqlInput.addEventListener('keydown', e => {
      if ((e.key === 'Enter' && (e.ctrlKey || e.shiftKey))) {
        e.preventDefault();
        runBtn.click();
      }
    });
  </script>
</body>
</html>
