<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>SQLite Viewer with sql.js</title>
  <style>
    /* Reset and base */
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
      max-width: 350px;
      height: 600px;
      overflow: hidden;
      user-select: none;
    }
    header {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
      text-align: center;
      text-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }
    #db-file-label {
      display: inline-block;
      padding: 10px 15px;
      background-color: #5a4ba3;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 10px;
      user-select: none;
      transition: background-color 0.3s ease;
    }
    #db-file-label:hover {
      background-color: #7d69e3;
    }
    #db-file {
      display: none;
    }
    #status {
      font-size: 0.9rem;
      min-height: 1.5rem;
      margin-bottom: 8px;
      color: #ffecb3;
      text-align: center;
      user-select: text;
      word-break: break-word;
    }
    textarea {
      font-family: monospace;
      font-size: 1rem;
      border-radius: 8px;
      border: none;
      padding: 8px;
      margin-bottom: 10px;
      width: 100%;
      resize: vertical;
      min-height: 80px;
      max-height: 150px;
      color: #222;
    }
    button {
      background-color: #7d69e3;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
      user-select: none;
      width: 100%;
    }
    button:disabled {
      background-color: #3a316d;
      cursor: not-allowed;
    }
    button:hover:not(:disabled) {
      background-color: #a194f7;
    }
    #result {
      background-color: rgba(255,255,255,0.9);
      border-radius: 8px;
      padding: 10px;
      overflow-x: auto;
      max-height: 180px;
      font-size: 0.85rem;
      white-space: pre-wrap;
      user-select: text;
      color: #000;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 6px;
    }
    th, td {
      border: 1px solid rgba(0,0,0,0.3);
      padding: 6px 8px;
      text-align: left;
      max-width: 130px;
      word-wrap: break-word;
    }
    th {
      background-color: rgba(0,0,0,0.15);
    }
    footer {
      margin-top: auto;
      font-size: 0.75rem;
      color: #ccc;
      text-align: center;
      user-select: none;
      padding: 8px 0 2px 0;
    }
    a {
      color: #524de8;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>SQLite Viewer with sql.js</header>

  <label id="db-file-label" for="db-file" aria-describedby="status">Select SQLite DB File</label>
  <input type="file" id="db-file" accept=".sqlite,.db,.sqlite3,.bin" />
  <div id="status" role="status" aria-live="polite">Please select a SQLite database file</div>

  <textarea id="sql-input" placeholder="Enter SQL query here (e.g. SELECT * FROM table)" aria-label="SQL Query Input" disabled></textarea>
  <button id="run-query" disabled>Run Query</button>

  <div id="result" aria-live="polite" aria-atomic="true"></div>

  <footer>
    Powered by <a href="https://sql.js.org/" target="_blank" rel="noopener noreferrer">sql.js</a>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
  <script src="app.js"></script>
</body>
</html>
