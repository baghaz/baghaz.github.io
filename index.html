<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Product List - coebegueDB.sqlite</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
      min-height: 100vh;
      box-sizing: border-box;
      max-width: 100vw;
    }
    header {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 12px;
      text-align: center;
      text-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }
    #status {
      font-size: 1rem;
      min-height: 1.5rem;
      margin-bottom: 12px;
      color: #ffecb3;
      text-align: center;
      word-break: break-word;
    }
    #result {
      background-color: rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 10px;
      overflow-x: auto;
      max-width: 100vw;
      font-size: 0.95rem;
      white-space: pre-wrap;
      user-select: text;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 6px;
      background-color: rgba(255,255,255,0.07);
      color: #fff;
    }
    th, td {
      border: 1px solid rgba(255,255,255,0.3);
      padding: 6px 8px;
      text-align: left;
      max-width: 130px;
      word-break: break-word;
    }
    th {
      background-color: rgba(255,255,255,0.18);
    }
    tr:nth-child(even) {
      background-color: rgba(255,255,255,0.06);
    }
    @media (max-width: 600px) {
      table, th, td {
        font-size: 0.85rem;
      }
      #result {
        padding: 4px;
      }
      th, td {
        padding: 4px 5px;
      }
    }
    footer {
      margin-top: auto;
      font-size: 0.75rem;
      color: #ccc;
      text-align: center;
      user-select: none;
      padding: 8px 0 2px 0;
    }
    a { color: #b3b0f7; }
  </style>
</head>
<body>
  <header>Product List from coebegueDB.sqlite</header>
  <div id="status" role="status" aria-live="polite">Loading sql.js and database...</div>
  <div id="result" aria-live="polite" aria-atomic="true"></div>
  <footer>
    Powered by <a href="https://sql.js.org/" target="_blank" rel="noopener noreferrer">sql.js</a>
  </footer>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
  <script>
    const status = document.getElementById('status');
    const resultDiv = document.getElementById('result');

    // REPLACE this URL with your raw GitHub file!
    const DB_URL = "https://baghaz.github.io/db/coebegueDB.sqlite";

    let db = null;
    let SQL = null;

    async function fetchDatabase(url) {
      status.textContent = "Downloading database file...";
      const response = await fetch(url);
      if (!response.ok) throw new Error('Database file not found or CORS blocked');
      const buffer = await response.arrayBuffer();
      status.textContent = "Database downloaded.";
      return new Uint8Array(buffer);
    }

    function renderTable(columns, rows) {
      const table = document.createElement('table');
      const thead = document.createElement('thead');
      const headerRow = document.createElement('tr');
      columns.forEach(col => {
        const th = document.createElement('th');
        th.textContent = col;
        headerRow.appendChild(th);
      });
      thead.appendChild(headerRow);
      table.appendChild(thead);

      const tbody = document.createElement('tbody');
      rows.forEach(row => {
        const tr = document.createElement('tr');
        row.forEach(cell => {
          const td = document.createElement('td');
          td.textContent = cell === null ? 'NULL' : cell;
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      return table;
    }

    async function loadAndShowProducts() {
      try {
        status.textContent = "Loading sql.js...";
        SQL = await initSqlJs({
          locateFile: file => 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/' + file
        });
        status.textContent = "Loading database file from GitHub...";
        const dbData = await fetchDatabase(DB_URL);
        db = new SQL.Database(dbData);
        status.textContent = "Database loaded. Querying products...";

        // Query products table with specified columns
        const query = `
          SELECT id, name, description, price, stock, category_id
          FROM products
          ORDER BY id
        `;
        const results = db.exec(query);
        if (!results || results.length === 0 || !results[0].values.length) {
          resultDiv.textContent = "No products found.";
        } else {
          const { columns, values } = results[0];
          resultDiv.innerHTML = "";
          resultDiv.appendChild(renderTable(columns, values));
        }
        status.textContent = "Product list loaded.";
      } catch (err) {
        status.textContent = "Error: " + err.message;
        resultDiv.textContent = "";
      }
    }

    loadAndShowProducts();
  </script>
</body>
</html>
